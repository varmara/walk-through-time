<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nottingham · Walk Through Time</title>
<meta name="description" content="Nottingham city centre in 3D, every building coloured by the year it was built.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../lib/maplibre-gl.css">
<link rel="stylesheet" href="../app/city.css">
</head>
<body data-city="nottingham">
<div id="map" aria-label="3D map of Nottingham city centre"></div>

<div class="top">
  <div class="brand"><b><a href="../" style="color:inherit;text-decoration:none">Walk Through Time</a> · Nottingham</b><span id="count">loading…</span></div>
  <button class="icon" id="reset" aria-label="Back to the starting view">⌂</button>
</div>

<section class="sheet" id="sheet">
  <div id="controls" style="display:grid;gap:10px">
    <div class="yearrow">
      <div><div class="yearlbl">The city in</div><div class="year" id="yearOut">2026</div></div>
      <button class="fold" id="fold" aria-expanded="true" aria-label="Show fewer controls">▾</button>
      <button class="play" id="play" aria-label="Play the city's growth">▶</button>
    </div>
    <div class="sliderwrap">
      <input type="range" id="year" min="0" max="1000" step="1" value="1000" aria-label="Year">
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="legend" id="legend"></div>
    <p class="note">Paler colours mean the date is approximate.</p>
    <div id="layerSection" class="section" hidden>
      <div class="seclbl">Stories and layers</div>
      <div class="chips" id="layerChips" role="group" aria-label="Stories and layers"></div>
      <div class="layerinfo" id="layerInfo" hidden>
        <p id="lIntro"></p>
        <div class="items" id="lItems"></div>
        <p class="src" id="lSource"></p>
      </div>
    </div>
    <div class="seclbl">Map</div>
    <div class="chips" role="group" aria-label="Map options">
      <button class="chip" id="tUnknown" aria-pressed="true">Undated</button>
      <button class="chip" data-base="none" aria-pressed="true">No basemap</button>
      <button class="chip" data-base="osm" aria-pressed="false">Street map</button>
      <button class="chip" data-base="nls" aria-pressed="false">1888–1913 map</button>
    </div>
    <div class="keyrow" id="keyRow" hidden>
      <input id="mtKey" placeholder="MapTiler key for the old map" autocomplete="off" spellcheck="false">
      <button class="chip" id="mtSave">Save</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <article class="card" id="card" hidden>
    <div class="head"><h2 id="cTitle"></h2><button class="close" id="cClose" aria-label="Close">✕</button></div>
    <img id="cImg" alt="" hidden>
    <dl class="facts" id="cFacts"></dl>
    <div id="cStories"></div>
    <div id="cLinks" style="display:flex;flex-wrap:wrap;gap:12px"></div>
  </article>
</section>

<div class="loader" id="loader"><div><span>Building the city</span><b id="lpct">0%</b><span id="lstep">loading map data…</span></div></div>

<script>
window.addEventListener('error', e => { const s = document.getElementById('status'); if (s) s.textContent = 'Error: ' + e.message; });
window.addEventListener('unhandledrejection', e => { const s = document.getElementById('status'); if (s) s.textContent = 'Error: ' + ((e.reason && e.reason.message) || e.reason); });
</script>
<script src="../lib/maplibre-gl.js"></script>
<script src="../app/city.js"></script>
</body>
</html>
