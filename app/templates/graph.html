<!doctype html>
<!-- The graph page for each city, written by pipeline/pages.py. Edit this, not the written copies. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{name}} graph · Walk Through Time</title>
<meta name="description" content="People and story themes of {{name}}, linked to the buildings and places where a checked story ties them.">
<link rel="icon" href="../app/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<script>
  window.__v = Math.floor(Date.now() / 6e5);   // fresh files at least every 10 minutes (GitHub Pages caching)
  document.write('<link rel="stylesheet" href="../app/theme.css?v=' + window.__v + '">');
  document.write('<link rel="stylesheet" href="../app/graph.css?v=' + window.__v + '">');
</script>
</head>
<body data-city="{{id}}">
<svg id="graph" width="100%" height="100%" aria-label="Graph of people, story themes and places"></svg>
<div class="loading" id="loading">Loading the graph…</div>

<div class="top">
  <div class="bar">
    <div class="brand"><a href="./" aria-label="Back to the map"><img src="../app/logo.svg" alt="" width="20" height="20">← Map</a></div>
    <input class="find" id="find" type="search" placeholder="Find a person or place" aria-label="Find a person or place" autocomplete="off">
  </div>
  <div class="kinds" id="kinds" aria-label="Kinds of point to show"></div>
  <details class="layout" id="layout"><summary>Layout</summary><div class="params" id="params"></div></details>
</div>
<div class="hint" id="hint">Each line is a checked story. Diamonds are story themes, squares are places. Tap a point.</div>

<div class="zoom" id="zoom" aria-label="Zoom">
  <button id="zIn" aria-label="Zoom in">+</button>
  <button id="zOut" aria-label="Zoom out">−</button>
  <button id="zFit" aria-label="Show the whole graph" title="Show the whole graph"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="shead"><div style="flex:1"><h2 id="sTitle"></h2><div class="stype" id="sType"></div></div>
    <button class="close" id="close" aria-label="Close">✕</button></div>
  <button class="go" id="go"></button>
  <div class="links" id="links"></div>
</div>

<script src="../lib/d3.min.js"></script>
<script>document.write('<script src="../app/graph.js?v=' + window.__v + '"><\/script>');</script>
</body>
</html>
