name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m tools.probe "Listed buildings in Nottingham (Clifton North ward)" "Listed buildings in Nottingham (Bridge ward)"
