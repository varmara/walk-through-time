# Temporary: checks for the hills on the map and the Council Tax areas, from GitHub's servers.
name: Probe ground data
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q "rasterio==1.4.3" "numpy==2.2.6" "pillow==11.3.0"
      - name: Council Tax areas
        run: |
          for v in BGC_V5 BGC_V4 BGC_V3 BSC_V4 BSC_V3 BFC_V10 BFE_V10 BFC_V8; do
            u="https://services1.arcgis.com/ESMARspQHYMw9BZ9/arcgis/rest/services/Lower_layer_Super_Output_Areas_December_2021_Boundaries_EW_$v/FeatureServer/0"
            echo "== $v: $(curl -sS "$u?f=json" | head -c 300)"
            echo "   query: $(curl -sS "$u/query?where=1%3D1&geometry=-1.16,52.94,-1.15,52.95&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=*&returnGeometry=false&f=json" | head -c 400)"
          done
      - name: One square, as it is
        if: false
        run: |
          curl -sS -L -A "walk-through-time/1.0" -o sq.zip https://environment.data.gov.uk/tiles/collections/survey/lidar_composite_dtm/2022/2/SK5535
          unzip -o -q sq.zip
          python3 - <<'PY'
          import rasterio, numpy as np
          with rasterio.open("SK53ne_DTM_2m.tif") as s:
              print(s.profile)
              a = s.read(1, masked=True)
              print("min", a.min(), "max", a.max(), "mean", a.mean(), "masked", a.mask.mean() if a.mask is not np.ma.nomask else 0)
              print(a[2000:2003, 2000:2003])
          PY
      - name: Ground tiles
        if: false
        run: |
          mkdir -p data/nottingham
          echo '{}' > data/nottingham.json
          python -m pipeline.run nottingham --only s10_ground
          du -sh data/nottingham/ground; find data/nottingham/ground -name '*.png' | wc -l
          python3 -c "import json;print(json.load(open('data/nottingham.json'))['ground'])"
      - uses: actions/upload-artifact@v4
        with:
          name: ground
          path: data/nottingham/ground
          retention-days: 3
