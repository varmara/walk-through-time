# Temporary: checks for the hills on the map and the Council Tax areas, from GitHub's servers.
name: Probe ground data
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q "rasterio==1.4.3" "numpy==2.2.6" "pillow==11.3.0"
      - name: Council Tax areas
        run: |
          U="https://services1.arcgis.com/ESMARspQHYMw9BZ9/arcgis/rest/services/Lower_layer_Super_Output_Areas_December_2021_Boundaries_EW_BSC_V4/FeatureServer/0?f=json"
          echo "== with a referer: $(curl -sS -H 'Referer: https://geoportal.statistics.gov.uk/' "$U" | head -c 200)"
          for host in open-geography-portalx-ons.hub.arcgis.com geoportal.statistics.gov.uk; do
            for slug in lower-layer-super-output-areas-december-2021-boundaries-ew-bsc-v4-2 lower-layer-super-output-areas-december-2021-boundaries-ew-bgc-v5-2; do
              r=$(curl -sS -L "https://$host/api/v3/datasets/ons::$slug" | head -c 100000)
              id=$(echo "$r" | python3 -c "import sys,json
          try: d=json.load(sys.stdin); print(d['data']['id'])
          except Exception as e: print('none', str(e)[:80])")
              echo "== $host $slug: id $id; $(echo "$r" | head -c 150)"
              item=${id%%_*}
              if [ "$item" != none ]; then
                code=$(curl -sS -L -o g.json -w '%{http_code} %{size_download}' "https://$host/api/download/v1/items/$item/geojson?layers=0&geometry=%7B%22xmin%22%3A-1.16%2C%22ymin%22%3A52.94%2C%22xmax%22%3A-1.15%2C%22ymax%22%3A52.95%7D")
                echo "   download: $code $(head -c 200 g.json)"
              fi
            done
          done
      - name: One square, as it is
        if: false
        run: |
          curl -sS -L -A "walk-through-time/1.0" -o sq.zip https://environment.data.gov.uk/tiles/collections/survey/lidar_composite_dtm/2022/2/SK5535
          unzip -o -q sq.zip
          python3 - <<'PY'
          import rasterio, numpy as np
          with rasterio.open("SK53ne_DTM_2m.tif") as s:
              print(s.profile)
              a = s.read(1, masked=True)
              print("min", a.min(), "max", a.max(), "mean", a.mean(), "masked", a.mask.mean() if a.mask is not np.ma.nomask else 0)
              print(a[2000:2003, 2000:2003])
          PY
      - name: Ground tiles
        if: false
        run: |
          mkdir -p data/nottingham
          echo '{}' > data/nottingham.json
          python -m pipeline.run nottingham --only s10_ground
          du -sh data/nottingham/ground; find data/nottingham/ground -name '*.png' | wc -l
          python3 -c "import json;print(json.load(open('data/nottingham.json'))['ground'])"
      - uses: actions/upload-artifact@v4
        with:
          name: ground
          path: data/nottingham/ground
          retention-days: 3
