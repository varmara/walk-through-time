# Temporary: which Environment Agency LIDAR services answer from GitHub's servers (for the hills on the map).
name: Probe ground data
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          UA="walk-through-time/1.0 (+https://github.com/varmara/walk-through-time)"
          for base in lidar-composite-digital-terrain-model-dtm-2m lidar-composite-digital-terrain-model-dtm-1m \
                      lidar-composite-digital-terrain-model-dtm-2m-2022 lidar-composite-digital-terrain-model-dtm-1m-2022; do
            for svc in wcs wms; do
              u="https://environment.data.gov.uk/spatialdata/$base/$svc?service=$svc&request=GetCapabilities"
              code=$(curl -sS -A "$UA" -o cap.xml -w '%{http_code} %{size_download}' "$u" || echo fail)
              echo "== $base $svc: $code"; head -c 1500 cap.xml | tr '\n' ' ' | grep -o '<[a-zA-Z:]*\(Identifier\|CoverageId\|Name\)>[^<]*' | head -8; echo
            done
          done
          echo "== survey catalogue"
          curl -sS -A "$UA" -o s.json -w '%{http_code} %{size_download}\n' "https://environment.data.gov.uk/backend/catalog/api/tiles/collections/survey/search?bbox=-1.2,52.94,-1.14,52.96" ; head -c 800 s.json; echo
