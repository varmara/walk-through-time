name: Build city data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "stories/**"
      - "cities/**"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the pipeline for every city
        run: |
          cities=$(ls cities/*.json | xargs -n1 basename | sed 's/\.json$//')
          python -m pipeline.run $cities

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to data."
          else
            git commit -m "Update city data"
            git pull --rebase
            git push
          fi
