name: Build and publish

# Builds the city data (pipeline/) and publishes the site to the "site" branch, which GitHub Pages serves:
# the page's files from main plus the built data, as one commit replaced every time, so main holds only code and
# stories and does not grow with every build. A push that changes only the page publishes without rebuilding.

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Fetch everything afresh: OpenStreetMap and every web service (about 15 minutes)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 1 1,7 *"   # twice a year: 1 January and 1 July, 04:17 UTC
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "stories/**"
      - "cities/**"
      - "tests/**"
      - "app/**"
      - "lib/**"
      - "index.html"
      - "nottingham/**"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write      # to push the site, work and downloads branches

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04      # pinned: the test browser (Playwright) and the cached tippecanoe are built for it
    timeout-minutes: 90
    env:
      # Scheduled runs and "refresh" runs download everything again; others reuse the saved download.
      REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh == true }}
      WTT_CACHE: ${{ github.workspace }}/cache    # saved answers from web services (pipeline/common.py)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50      # to see which files a push changed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The last published data: a build that starts part-way through keeps the files earlier steps wrote, and a
      # page-only change publishes it as it is.
      - name: Restore the published data
        run: |
          if git fetch -q --depth 1 origin site 2>/dev/null; then
            rm -rf data && git archive FETCH_HEAD data | tar -x && echo "Restored data from the site branch"
          fi

      - name: Restore the saved OpenStreetMap download
        if: env.REFRESH != 'true'
        run: |
          if git fetch -q --depth 1 origin downloads 2>/dev/null; then
            for f in $(git ls-tree --name-only FETCH_HEAD | grep '\.osm\.json\.gz$'); do
              c=${f%.osm.json.gz}
              mkdir -p "work/$c"
              git show "FETCH_HEAD:$f" | gunzip > "work/$c/osm.json"
              git show "FETCH_HEAD:$c.osm.stamp" > "work/$c/osm.stamp"
              echo "Restored download for $c"
            done
          else
            echo "No saved download yet; the pipeline will fetch one."
          fi

      # Saved answers from web services, and the last build's intermediate files (work/), from earlier builds.
      # Scheduled and "refresh" builds start without them, so they fetch and compute everything afresh.
      # (GitHub drops a cache that no build has used for 7 days; the next build then simply fetches again.)
      - name: Restore saved web answers
        if: env.REFRESH != 'true'
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: web-${{ github.run_id }}
          restore-keys: web-

      - name: Restore the last build's work files
        id: work
        if: env.REFRESH != 'true'
        uses: actions/cache/restore@v4
        with:
          path: work
          key: work-${{ github.run_id }}
          restore-keys: work-

      # "osm.fresh" marks a download made by this build; one in the restored files is an earlier build's
      - name: Forget earlier builds' download marks
        run: rm -f work/*/osm.fresh

      # Start at the earliest step whose code changed (stories: the stories step), when the last build's work
      # files are here; otherwise run everything (pipeline/plan.py).
      - name: Choose where to start
        id: plan
        run: |
          # compare with the commit the restored work files were built from (a queued build can be replaced by a
          # newer one, so the push's own "before" commit may not be what was last built)
          start=all
          last=$(cat work/.source_sha 2>/dev/null || echo "${{ github.event.before }}")
          if [ "${{ github.event_name }}" = push ] && [ -n "${{ steps.work.outputs.cache-matched-key }}" ] \
             && git cat-file -e "$last^{commit}" 2>/dev/null; then
            start=$(git diff --name-only "$last" "${{ github.sha }}" | python -m pipeline.plan)
          fi
          if [ "${{ github.event_name }}" = push ] && [ "$start" = all ] && git cat-file -e "$last^{commit}" 2>/dev/null \
             && [ -z "$(git diff --name-only "$last" "${{ github.sha }}" | python -m pipeline.plan --needs-build)" ]; then
            start=none        # only the page changed
          fi
          echo "Starting at: $start"
          echo "start=$start" >> "$GITHUB_OUTPUT"

      # tippecanoe turns the buildings into vector tiles (step s10_tiles); built once, then kept in the cache
      - name: Restore tippecanoe
        if: steps.plan.outputs.start != 'none'
        id: tippecanoe
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe
          key: tippecanoe-2.79.0-ubuntu-24.04

      - name: Build tippecanoe
        if: steps.plan.outputs.start != 'none' && steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -q libsqlite3-dev zlib1g-dev
          git clone -q --depth 1 -b 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j4 tippecanoe
          mkdir -p ~/tippecanoe && cp /tmp/tippecanoe/tippecanoe ~/tippecanoe/

      - name: Run the pipeline for every city
        if: steps.plan.outputs.start != 'none'
        env:
          TIPPECANOE: /home/runner/tippecanoe/tippecanoe
        run: |
          cities=$(ls cities/*.json | xargs -n1 basename | sed 's/\.json$//')
          start="${{ steps.plan.outputs.start }}"
          if [ "$REFRESH" = "true" ]; then
            python -m pipeline.run $cities
          elif [ "$start" != all ]; then
            python -m pipeline.run $cities --from "$start" --reuse-downloads
          else
            python -m pipeline.run $cities --reuse-downloads
          fi

      - name: Save web answers for the next build
        if: steps.plan.outputs.start != 'none'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: web-${{ github.run_id }}

      - name: Save work files for the next build
        if: steps.plan.outputs.start != 'none'
        run: echo "${{ github.sha }}" > work/.source_sha

      - if: steps.plan.outputs.start != 'none'
        uses: actions/cache/save@v4
        with:
          path: work
          key: work-${{ github.run_id }}

      # The build's intermediate files, for working on the pipeline on a computer without fetching everything
      # (tools/fetch-built.sh). Replaced every build; not part of the site. Saved before the checks, so a
      # build that fails them can be looked into.
      - name: Save the work files for development
        if: steps.plan.outputs.start != 'none'
        env:
          TOKEN: ${{ github.token }}
        run: |
          out=$(mktemp -d)
          tar -C work --exclude='*/osm.json' -czf "$out/work.tar.gz" .
          cd "$out"
          split -b 90m -d work.tar.gz work.tar.gz. && rm work.tar.gz      # GitHub refuses files over 100 MB
          git init -q -b work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Work files\n\nThe last build'"'"'s intermediate files (pipeline/), for development: tools/fetch-built.sh.\n' > README.md
          git add . && git commit -q -m "Work files from ${GITHUB_SHA::7}"
          for t in 1 2 3; do
            git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" work && break
            sleep 20
          done

      # Checks before anything is published (tests/): the naming rules and the titles of known buildings, the
      # parsers, and that every reference in the data points at something; then the page itself, in a browser.
      - name: Check the data
        run: python -m unittest discover -s tests -t . -q

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html app lib cities data _site/
          for c in $(ls cities/*.json | xargs -n1 basename | sed 's/\.json$//'); do cp -r "$c" _site/; done
          touch _site/.nojekyll          # serve the files as they are

      - name: Restore the test browser
        uses: actions/cache@v4
        with:
          path: |
            ~/pw
            ~/.cache/ms-playwright
          key: playwright-1.56.0-ubuntu-24.04

      - name: Check the page in a browser
        run: |
          [ -d ~/pw/node_modules/playwright ] || npm i -q --no-save --prefix ~/pw playwright@1.56.0
          ~/pw/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          python -m http.server 8642 -d _site >/dev/null 2>&1 &
          sleep 1
          for c in $(ls cities/*.json | xargs -n1 basename | sed 's/\.json$//'); do
            NODE_PATH=~/pw/node_modules node tests/page/smoke.cjs http://localhost:8642/ "$c"
          done

      - name: Publish the site
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Site built from ${GITHUB_SHA::7}"
          for t in 1 2 3; do
            git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site && break
            sleep 20
          done

      - name: Save new OpenStreetMap downloads
        if: steps.plan.outputs.start != 'none' && hashFiles('work/*/osm.fresh') != ''
        env:
          TOKEN: ${{ github.token }}
        run: |
          out=$(mktemp -d)
          for d in work/*/; do
            c=$(basename "$d")
            [ -f "$d/osm.json" ] && [ -f "$d/osm.stamp" ] || continue
            gzip -9 -c "$d/osm.json" > "$out/$c.osm.json.gz"
            cp "$d/osm.stamp" "$out/$c.osm.stamp"
          done
          cd "$out"
          git init -q -b downloads
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Saved downloads\n\nOpenStreetMap data (ODbL, © OpenStreetMap contributors) as last downloaded by the\npipeline, reused by later runs. Replaced on every fresh download; not part of the site.\n' > README.md
          git add . && git commit -q -m "OpenStreetMap downloads"
          for t in 1 2 3; do       # a large push can time out (HTTP 408): try again
            git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" downloads && break
            sleep 20
          done
          ls -la
