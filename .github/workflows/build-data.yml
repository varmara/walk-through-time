name: Build city data

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Download fresh OpenStreetMap data (slow, most of an hour)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 1 1,7 *"   # twice a year: 1 January and 1 July, 04:17 UTC
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "stories/**"
      - "cities/**"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Scheduled runs and "refresh" runs download everything again; others reuse the saved download.
      REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh == true }}
      WTT_CACHE: ${{ github.workspace }}/cache    # saved answers from web services (pipeline/common.py)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50      # to see which files a push changed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the saved OpenStreetMap download
        if: env.REFRESH != 'true'
        run: |
          if git fetch -q --depth 1 origin downloads 2>/dev/null; then
            for f in $(git ls-tree --name-only FETCH_HEAD | grep '\.osm\.json\.gz$'); do
              c=${f%.osm.json.gz}
              mkdir -p "work/$c"
              git show "FETCH_HEAD:$f" | gunzip > "work/$c/osm.json"
              git show "FETCH_HEAD:$c.osm.stamp" > "work/$c/osm.stamp"
              echo "Restored download for $c"
            done
          else
            echo "No saved download yet; the pipeline will fetch one."
          fi

      # Saved answers from web services, and the last build's intermediate files (work/), from earlier builds.
      # Scheduled and "refresh" builds start without them, so they fetch and compute everything afresh.
      # (GitHub drops a cache that no build has used for 7 days; the next build then simply fetches again.)
      - name: Restore saved web answers
        if: env.REFRESH != 'true'
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: web-${{ github.run_id }}
          restore-keys: web-

      - name: Restore the last build's work files
        id: work
        if: env.REFRESH != 'true'
        uses: actions/cache/restore@v4
        with:
          path: work
          key: work-${{ github.run_id }}
          restore-keys: work-

      # Start at the earliest step whose code changed (stories: the stories step), when the last build's work
      # files are here; otherwise run everything (pipeline/plan.py).
      - name: Choose where to start
        id: plan
        run: |
          # compare with the commit the restored work files were built from (a queued build can be replaced by a
          # newer one, so the push's own "before" commit may not be what was last built)
          start=all
          last=$(cat work/.source_sha 2>/dev/null || echo "${{ github.event.before }}")
          if [ "${{ github.event_name }}" = push ] && [ -n "${{ steps.work.outputs.cache-matched-key }}" ] \
             && git cat-file -e "$last^{commit}" 2>/dev/null; then
            start=$(git diff --name-only "$last" "${{ github.sha }}" | python -m pipeline.plan)
          fi
          echo "Starting at: $start"
          echo "start=$start" >> "$GITHUB_OUTPUT"

      # tippecanoe turns the buildings into vector tiles (step s10_tiles); built once, then kept in the cache
      - name: Restore tippecanoe
        id: tippecanoe
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe
          key: tippecanoe-2.79.0-${{ runner.os }}

      - name: Build tippecanoe
        if: steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -q libsqlite3-dev zlib1g-dev
          git clone -q --depth 1 -b 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j4 tippecanoe
          mkdir -p ~/tippecanoe && cp /tmp/tippecanoe/tippecanoe ~/tippecanoe/

      - name: Run the pipeline for every city
        env:
          TIPPECANOE: /home/runner/tippecanoe/tippecanoe
        run: |
          cities=$(ls cities/*.json | xargs -n1 basename | sed 's/\.json$//')
          start="${{ steps.plan.outputs.start }}"
          if [ "$REFRESH" = "true" ]; then
            python -m pipeline.run $cities
          elif [ "$start" != all ]; then
            python -m pipeline.run $cities --from "$start" --reuse-downloads
          else
            python -m pipeline.run $cities --reuse-downloads
          fi

      - name: Save web answers for the next build
        uses: actions/cache/save@v4
        with:
          path: cache
          key: web-${{ github.run_id }}

      - name: Save work files for the next build
        run: echo "${{ github.sha }}" > work/.source_sha

      - uses: actions/cache/save@v4
        with:
          path: work
          key: work-${{ github.run_id }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The data files are rebuilt in full, so this run's files replace whatever is on main now
          # (another run may have pushed while this one was working).
          git fetch -q origin main
          git reset -q FETCH_HEAD
          git add data
          if git diff --cached --quiet; then
            echo "No changes to data."
          else
            git commit -m "Update city data"
            git push origin HEAD:main
          fi

      - name: Save new OpenStreetMap downloads
        if: hashFiles('work/*/osm.fresh') != ''
        env:
          TOKEN: ${{ github.token }}
        run: |
          out=$(mktemp -d)
          for d in work/*/; do
            c=$(basename "$d")
            [ -f "$d/osm.json" ] && [ -f "$d/osm.stamp" ] || continue
            gzip -9 -c "$d/osm.json" > "$out/$c.osm.json.gz"
            cp "$d/osm.stamp" "$out/$c.osm.stamp"
          done
          cd "$out"
          git init -q -b downloads
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Saved downloads\n\nOpenStreetMap data (ODbL, © OpenStreetMap contributors) as last downloaded by the\npipeline, reused by later runs. Replaced on every fresh download; not part of the site.\n' > README.md
          git add . && git commit -q -m "OpenStreetMap downloads"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" downloads
          ls -la
